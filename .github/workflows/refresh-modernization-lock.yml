name: Refresh modernization lockfile

on:
  push:
    branches:
      - modernize/b1-vite-toolchain
    paths:
      - "package.json"
      - ".github/workflows/refresh-modernization-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernize/b1-vite-toolchain
          fetch-depth: 0

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Regenerate npm lockfile from the modern package contract
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Publish changed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "B1: regenerate npm lockfile for Vite toolchain"
          git pull --rebase origin modernize/b1-vite-toolchain
          git push origin HEAD:modernize/b1-vite-toolchain

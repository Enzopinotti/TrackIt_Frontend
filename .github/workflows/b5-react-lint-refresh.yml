name: B5 React lint refresh

on:
  push:
    branches:
      - modernize/b5-source-quality
    paths:
      - .github/workflows/b5-react-lint-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout B5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernize/b5-source-quality
          fetch-depth: 0

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install React JSX lint support
        run: npm install --save-dev --save-exact eslint-plugin-react@7.37.5

      - name: Commit refreshed package graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "B5: add React JSX lint support"
          git push origin HEAD:modernize/b5-source-quality

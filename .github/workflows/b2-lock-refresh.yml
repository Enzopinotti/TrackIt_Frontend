name: B2 lock refresh

on:
  push:
    branches:
      - modernize/b2-react19-router8

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B2 branch
        uses: actions/checkout@v4
        with:
          ref: modernize/b2-react19-router8
          fetch-depth: 0

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Regenerate lockfile from B2 manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "B2: regenerate modern runtime lockfile"
          git push origin HEAD:modernize/b2-react19-router8
